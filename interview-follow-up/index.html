<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>면접 꼬리 질문 연습 프롬프트 5개 · AI 선배</title>
<meta name="description" content="AI를 면접관 삼아 답하고, 꼬리 질문까지 미리 연습하는 프롬프트 5개">
<meta property="og:title" content="면접 꼬리 질문 연습 프롬프트 5개 · AI 선배">
<meta property="og:description" content="AI를 면접관 삼아 답하고, 꼬리 질문까지 미리 연습하는 프롬프트 5개">
<meta property="og:locale" content="ko_KR">
<meta name="theme-color" content="#0F1B3D">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --navy:#0F1B3D; --navy2:#1A2A57; --lime:#C8F542;
    --bg:#F4F6FA; --card:#FFFFFF; --text:#0F1B3D; --sub:#5A6480;
    --box:#EEF0F4; --line:#DDE1EA;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all}
  header{background:var(--navy);color:#fff;padding:36px 20px 32px}
  .wrap{max-width:640px;margin:0 auto}
  .tag{display:inline-block;background:var(--lime);color:var(--navy);font-weight:800;font-size:13px;
    padding:4px 10px;border-radius:6px;margin-bottom:14px}
  h1{font-size:28px;font-weight:900;line-height:1.3;letter-spacing:-.5px}
  h1 em{font-style:normal;color:var(--lime)}
  header p{margin-top:10px;color:#C9D1E6;font-size:15px}
  .how{background:var(--navy2);border-radius:12px;padding:14px 16px;margin-top:20px;font-size:14px;color:#E3E8F5}
  .how b{color:var(--lime)}
  main{padding:24px 16px 40px}
  .card{background:var(--card);border-radius:16px;padding:20px 18px;margin-bottom:16px;
    box-shadow:0 1px 3px rgba(15,27,61,.06)}
  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .num{flex:none;width:34px;height:34px;border-radius:10px;background:var(--navy);color:var(--lime);
    font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center}
  h2{font-size:18px;font-weight:800;letter-spacing:-.3px}
  pre{background:var(--box);border-radius:10px;padding:14px;font-family:inherit;font-size:15px;
    white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;color:var(--text)}
  .ph{background:var(--lime);color:var(--navy);font-weight:700;border-radius:4px;padding:0 3px}
  .copy{margin-top:12px;width:100%;border:0;border-radius:10px;padding:14px;font-family:inherit;
    font-size:16px;font-weight:800;background:var(--navy);color:#fff;cursor:pointer;transition:background .15s}
  .copy:active{transform:scale(.99)}
  .copy.done{background:var(--lime);color:var(--navy)}
  .tip{font-size:14px;color:var(--sub);margin-top:8px}
  footer{text-align:center;padding:8px 20px 48px;color:var(--sub);font-size:14px}
  .follow{display:inline-block;margin-top:12px;background:var(--navy);color:var(--lime);text-decoration:none;
    font-weight:800;padding:12px 22px;border-radius:999px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <span class="tag">AI 선배 · 꼬리 질문 연습 편</span>
    <h1><em>꼬리 질문</em>,<br>AI랑 먼저 맞아보세요</h1>
    <p>질문 시작부터 연습 후 사실 점검까지.</p>
    <div class="how"><b>쓰는 법</b> — 복사 버튼을 누르고 ChatGPT·클로드에 붙여넣은 뒤, <span class="ph">[ ]</span> 부분만 내 내용으로 바꾸세요.</div>
  </div>
</header>

<main class="wrap" id="list"></main>

<footer>
  매일 아침, 퇴근 당겨주는 AI 활용법<br>
  <a class="follow" href="https://www.instagram.com/ai.sunbae/">@ai.sunbae 팔로우</a>
</footer>

<script>
const prompts = [
  { title: "꼬리 질문 면접 시작하기", text:
`너는 지원 직무의 면접관이야.
아래 자소서로 질문을 하나 하고,
내가 답하면 그 답을 근거로
꼬리 질문을 하나씩 이어가 줘.
한 번에 질문 하나만 해.
자소서에 없는 경험은 지어내지 마.
직무: [지원 직무]
자소서: [자소서 붙여넣기]` },
  { title: "막힌 질문, 의도부터 듣기", text:
`방금 질문에 답을 못 했어.
이 질문으로 확인하려는 게
무엇인지 먼저 설명해줘.
그다음 내 경험 메모 중에서
쓸 만한 걸 골라 이유를 말해줘.
답변 문장은 아직 쓰지 마.
메모: [내 경험 메모]` },
  { title: "내 답변, 면접관 눈으로 보기", text:
`아래는 방금 내 답변이야.
면접관 입장에서 아쉬운 점을
3개만 짚어줘.
예: 결론이 늦음, 근거 부족
고친 답변은 쓰지 말고,
보완할 점만 알려줘.
답변: [내 답변 붙여넣기]` },
  { title: "한 경험, 3단계로 파고들기", text:
`내 경험 하나로 꼬리 질문을
3단계로 깊게 이어가 줘.
1단계: 사실 확인
2단계: 이유와 판단
3단계: 다르게 했다면?
단계마다 질문은 하나씩,
내 답을 듣고 다음으로 넘어가.
경험: [경험 1개 요약]` },
  { title: "연습 끝, 내 답 사실 점검", text:
`지금까지 내가 한 답변만 모아서
질문별로 한 줄씩 정리해줘.
내가 말하지 않은 내용은 넣지 말고,
자소서와 다르게 말한 부분이
있으면 따로 표시해줘.
자소서: [자소서 붙여넣기]` }
];

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const list = document.getElementById('list');

prompts.forEach((p, i) => {
  const card = document.createElement('section');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-head"><div class="num">#${i+1}</div><h2>${esc(p.title)}</h2></div>
    <pre>${esc(p.text).replace(/\[[^\]]+\]/g, m => `<span class="ph">${m}</span>`)}</pre>
    <button class="copy" type="button">복사하기</button>`;
  card.querySelector('.copy').addEventListener('click', e => copy(p.text, e.currentTarget));
  list.appendChild(card);
});

async function copy(text, btn){
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch(_) {}
  if (!ok) {
    // 인스타그램 앱 내 브라우저 등 clipboard API가 막힌 환경용
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    try { ok = document.execCommand('copy'); } catch(_) {}
    document.body.removeChild(ta);
  }
  btn.textContent = ok ? '복사됐어요 ✓' : '길게 눌러 직접 복사해주세요';
  btn.classList.toggle('done', ok);
  setTimeout(() => { btn.textContent = '복사하기'; btn.classList.remove('done'); }, 1800);
}
</script>
</body>
</html>
