<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>프롬프트 모음 · AI 선배</title>
<meta name="description" content="카드뉴스에 나온 업무 프롬프트를 한곳에서 복사하세요">
<meta property="og:title" content="프롬프트 모음 · AI 선배">
<meta property="og:description" content="카드뉴스에 나온 업무 프롬프트를 한곳에서 복사하세요">
<meta property="og:locale" content="ko_KR">
<meta name="theme-color" content="#0F1B3D">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --navy:#0F1B3D; --navy2:#1A2A57; --lime:#C8F542;
    --bg:#F4F6FA; --card:#FFFFFF; --text:#0F1B3D; --sub:#5A6480;
    --box:#EEF0F4; --line:#DDE1EA;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all}
  header{background:var(--navy);color:#fff;padding:36px 20px 28px}
  .wrap{max-width:640px;margin:0 auto}
  .tag{display:inline-block;background:var(--lime);color:var(--navy);font-weight:800;font-size:13px;
    padding:4px 10px;border-radius:6px;margin-bottom:14px}
  h1{font-size:28px;font-weight:900;line-height:1.3;letter-spacing:-.5px}
  h1 em{font-style:normal;color:var(--lime)}
  header p{margin-top:10px;color:#C9D1E6;font-size:15px}
  .chips{display:flex;gap:8px;overflow-x:auto;margin-top:20px;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:0;border-radius:999px;padding:9px 14px;font-family:inherit;font-size:14px;font-weight:700;
    background:var(--navy2);color:#E3E8F5;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--lime);color:var(--navy)}
  main{padding:20px 16px 40px}
  .count{font-size:14px;color:var(--sub);margin:0 4px 12px}
  .item{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:18px;
    margin-bottom:12px;text-decoration:none;color:inherit;box-shadow:0 1px 3px rgba(15,27,61,.06)}
  .item:active{transform:scale(.99)}
  .body{flex:1;min-width:0}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;white-space:nowrap;font-size:13px;color:var(--sub);margin-bottom:4px}
  .corner{background:var(--box);color:var(--navy);font-weight:700;border-radius:6px;padding:2px 8px}
  .new{background:var(--lime);color:var(--navy);font-weight:800;border-radius:6px;padding:2px 8px}
  h2{font-size:18px;font-weight:800;letter-spacing:-.3px;line-height:1.4}
  .desc{font-size:14px;color:var(--sub);margin-top:2px}
  .arrow{flex:none;width:36px;height:36px;border-radius:10px;background:var(--navy);color:var(--lime);
    display:flex;align-items:center;justify-content:center}
  .empty{text-align:center;color:var(--sub);padding:40px 0;font-size:15px}
  footer{text-align:center;padding:8px 20px 48px;color:var(--sub);font-size:14px}
  .follow{display:inline-block;margin-top:12px;background:var(--navy);color:var(--lime);text-decoration:none;
    font-weight:800;padding:12px 22px;border-radius:999px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <span class="tag">AI 선배 · 프롬프트 모음</span>
    <h1>카드뉴스 프롬프트,<br>여기서 <em>바로 복사</em>하세요</h1>
    <p>보고 싶은 편을 누르면<br>복사 버튼이 있는 페이지로 가요.</p>
    <div class="chips" id="chips" role="group" aria-label="코너별 보기"></div>
  </div>
</header>

<main class="wrap">
  <p class="count" id="count"></p>
  <div id="list"></div>
</main>

<footer>
  매일 아침, 퇴근 당겨주는 AI 활용법<br>
  <a class="follow" href="https://www.instagram.com/ai.sunbae/">@ai.sunbae 팔로우</a>
</footer>

<script>
const CORNERS = ["전체", "복붙 프롬프트", "상황별 해결", "엑셀·PPT", "Before/After", "주간 총정리"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const listEl = document.getElementById('list');
const countEl = document.getElementById('count');
const chipsEl = document.getElementById('chips');
let pages = [];
let current = "전체";

function fmt(d){
  const [, m, day] = d.split('-');
  return `${Number(m)}월 ${Number(day)}일`;
}

function render(){
  const shown = current === "전체" ? pages : pages.filter(p => p.corner === current);
  countEl.textContent = `${shown.length}편`;
  if (!shown.length){
    listEl.innerHTML = '<p class="empty">아직 이 코너 글이 없어요.</p>';
    return;
  }
  listEl.innerHTML = shown.map((p, i) => `
    <a class="item" href="./${encodeURIComponent(p.slug)}/">
      <div class="body">
        <div class="meta">
          ${pages[0] === p ? '<span class="new">NEW</span>' : ''}
          <span class="corner">${esc(p.corner)}</span>
          <span>${esc(fmt(p.date))} · 프롬프트 ${esc(p.count)}개</span>
        </div>
        <h2>${esc(p.title)}</h2>
        <p class="desc">${esc(p.desc)}</p>
      </div>
      <span class="arrow" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </span>
    </a>`).join('');
}

function renderChips(){
  chipsEl.innerHTML = CORNERS.map(c =>
    `<button class="chip" type="button" aria-pressed="${c === current}">${esc(c)}</button>`).join('');
  chipsEl.querySelectorAll('.chip').forEach((b, i) => b.addEventListener('click', () => {
    current = CORNERS[i]; renderChips(); render();
  }));
}

renderChips();
fetch('./pages.json', {cache: 'no-store'})
  .then(r => r.json())
  .then(data => {
    pages = data.slice().sort((a, b) => b.date.localeCompare(a.date));
    render();
  })
  .catch(() => {
    listEl.innerHTML = '<p class="empty">목록을 불러오지 못했어요. 잠시 후 다시 열어주세요.</p>';
  });
</script>
</body>
</html>
